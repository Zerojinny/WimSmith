; ============================================================
;  Z_wimlib - 한국어 언어 파일 (lang\ko.ini)
;  여기에 없는 항목은 en.ini(영어)의 내용이 표시됩니다.
;
;  key = 문구           한 줄 문구
;  key += 문구          위 문구에 줄을 하나 더 붙임
;  {0}, {1} ...         프로그램이 값을 채워 넣는 자리이므로 지우지 마세요
;  ; 로 시작하는 줄은 주석입니다. UTF-8로 저장하세요.
; ============================================================

